[versions]
agp = "9.2.0"
# Also governs AGP's built-in Kotlin: AGP bundles a KGP runtime and
# auto-upgrades to the highest KGP on the classpath, so the Compose compiler
# plugin below pulls built-in Kotlin up to this version.
kotlin = "2.4.10"
composeBom = "2026.06.00"
# Overrides the BOM: the M3 Expressive components/theme live in the 1.5 alphas
# behind ExperimentalMaterial3ExpressiveApi — being on them is deliberate; the
# expressive catalog pages are the product (see ANDROID_PLAN.md §11).
material3 = "1.5.0-alpha24"
androidxActivity = "1.13.0"
androidxCoreSplashscreen = "1.2.0"
androidxNavigation3 = "1.1.4"
androidxDatastore = "1.2.1"
# Final release of the compose material icons line (frozen upstream, not in
# recent BOMs).
materialIconsCore = "1.7.8"

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIconsCore" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsCore" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
junit4 = { module = "junit:junit", version = "4.13.2" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
